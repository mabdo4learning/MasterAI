<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1e7" />
    <meta name="description" content="Lecturefolio — notes, slides and revision for every lecture of your degree, beautifully organised." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lecturefolio" />
    <meta property="og:url" content="https://lecturefolio.com/" />
    <meta property="og:title" content="Lecturefolio — Every lecture, beautifully kept." />
    <meta property="og:description" content="Notes, slides, photos and practice questions for every lecture, organised the moment you add them." />
    <meta property="og:image" content="https://lecturefolio.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lecturefolio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the saved theme and colour before the page paints (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var a = localStorage.getItem("accent");
        if (a && /^[a-z]+$/.test(a)) document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <title>Lecturefolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
